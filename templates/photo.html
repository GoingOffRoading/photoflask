<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoFlask – {{ photo['filename'] }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>📷 PhotoFlask</h1>
    <nav>
      <a href="{{ url_for('index') }}">← Gallery</a>
    </nav>
  </header>

  <main class="detail">
    <h2>{{ photo['filename'] }}</h2>
    <img src="{{ url_for('serve_photo', photo_id=photo['id']) }}"
         alt="{{ photo['filename'] }}" />
    <table class="meta">
      <tr><th>ID</th><td>{{ photo['id'] }}</td></tr>
      <tr><th>Filename</th><td>{{ photo['filename'] }}</td></tr>
      <tr><th>Path</th><td>{{ photo['filepath'] }}</td></tr>
      <tr><th>Added</th><td>{{ photo['added_at'] }}</td></tr>
    </table>
  </main>
</body>
</html>
