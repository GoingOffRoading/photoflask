<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhotoFlask Slideshow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #slideshow {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #photo-container {
            width: 80vw;
            max-width: 900px;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        #photo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #photo-container .no-photos {
            color: #888;
            font-size: 1.2rem;
        }

        button {
            background: #333;
            color: #eee;
            border: none;
            padding: 16px 24px;
            font-size: 2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        button:hover { background: #555; }
        button:disabled { opacity: 0.3; cursor: default; }

        #counter {
            margin-top: 14px;
            font-size: 0.95rem;
            color: #aaa;
        }

        #photo-name {
            margin-top: 10px;
            max-width: 80vw;
            color: #cfcfcf;
            font-size: 0.95rem;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div id="slideshow">
    <button id="btn-prev" onclick="goToPhoto(-1)">&#8592;</button>

    <div id="photo-container">
        {% if total == 0 %}
            <span class="no-photos">No photos found in the database.</span>
        {% else %}
            <img id="photo-img" src="/image/{{ photos[initial_index].guid }}" alt="Photo" onerror="this.alt='Failed to load: ' + this.src">
        {% endif %}
    </div>

    <button id="btn-next" onclick="goToPhoto(1)">&#8594;</button>
</div>

{% if total > 0 %}
<div id="counter">{{ initial_index + 1 }} / {{ total }}</div>
<div id="photo-name">{{ photos[initial_index].name }}</div>
{% endif %}

<script>
    const total = {{ total }};
    const photoNames = {{ photos | map(attribute='name') | list | tojson }};
    const photoGuids = {{ photos | map(attribute='guid') | list | tojson }};
    let current = {{ initial_index }};

    function updateUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set("guid", photoGuids[current]);
        window.history.replaceState({}, "", url);
    }

    function goToPhoto(direction) {
        current = (current + direction + total) % total;
        const img = document.getElementById("photo-img");
        img.src = "";
        img.src = "/image/" + photoGuids[current] + "?t=" + Date.now();
        document.getElementById("counter").textContent = (current + 1) + " / " + total;
        document.getElementById("photo-name").textContent = photoNames[current];
        updateUrl();
    }

    document.addEventListener("keydown", function(e) {
        if (e.key === "ArrowLeft") goToPhoto(-1);
        if (e.key === "ArrowRight") goToPhoto(1);
    });
</script>

</body>
</html>
